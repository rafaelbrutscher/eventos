upstream auth_service {
    server auth-service:80;
}

upstream eventos_service {
    server eventos-service:80;
}

upstream inscricoes_service {
    server inscricoes-service:80;
}

upstream presenca_service {
    server presenca-service:80;
}

upstream certificados_service {
    server certificados-service:8000;
}

upstream frontend {
    server frontend:80;
}

server {
    listen 80;
    server_name 177.44.248.89;

    # Auth Service
    location /api/auth/ {
        proxy_pass http://auth_service/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Eventos Service  
    location /api/eventos/ {
        proxy_pass http://eventos_service/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Inscrições Service
    location /api/inscricoes/ {
        proxy_pass http://inscricoes_service/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Presença Service
    location /api/presenca/ {
        proxy_pass http://presenca_service/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Certificados Service
    location /api/certificados/ {
        proxy_pass http://certificados_service/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Frontend (SPA)
    location / {
        proxy_pass http://frontend/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}