version: "3.9"

services:
  # Banco de Dados MySQL
  mysql:
    image: mysql:8.0
    container_name: eventos_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: eventos
      MYSQL_USER: eventos
      MYSQL_PASSWORD: eventos123
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - eventos_network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10



  # Redis para cache e filas
  redis:
    image: redis:7-alpine
    container_name: eventos_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - eventos_network
    command: redis-server --appendonly yes

  # Auth Service (Laravel)
  auth-service:
    build: ./backend/auth-service
    container_name: eventos_auth
    restart: unless-stopped
    environment:
      APP_NAME: "Auth Service"
      APP_ENV: production
      APP_DEBUG: false
      APP_URL: http://177.44.248.89:8001
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: eventos
      DB_USERNAME: eventos
      DB_PASSWORD: eventos123
      REDIS_HOST: redis
      REDIS_PORT: 6379
    ports:
      - "8001:8000"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - eventos_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/up"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Eventos Service (Laravel)
  eventos-service:
    build: ./backend/eventos-service
    container_name: eventos_eventos
    restart: unless-stopped
    environment:
      APP_NAME: "Eventos Service"
      APP_ENV: production
      APP_DEBUG: false
      APP_URL: http://177.44.248.89:8002
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: eventos
      DB_USERNAME: eventos
      DB_PASSWORD: eventos123
      REDIS_HOST: redis
      REDIS_PORT: 6379
    ports:
      - "8002:8000"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - eventos_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/up"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Inscrições Service (Laravel)
  inscricoes-service:
    build: ./backend/inscricoes-service
    container_name: eventos_inscricoes
    restart: unless-stopped
    environment:
      APP_NAME: "Inscrições Service"
      APP_ENV: production
      APP_DEBUG: false
      APP_URL: http://177.44.248.89:8003
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: eventos
      DB_USERNAME: eventos
      DB_PASSWORD: eventos123
      REDIS_HOST: redis
      REDIS_PORT: 6379
    ports:
      - "8003:8000"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - eventos_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/up"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Presença Service (Laravel)
  presenca-service:
    build: ./backend/presenca-service
    container_name: eventos_presenca
    restart: unless-stopped
    environment:
      APP_NAME: "Presença Service"
      APP_ENV: production
      APP_DEBUG: false
      APP_URL: http://177.44.248.89:8004
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: eventos
      DB_USERNAME: eventos
      DB_PASSWORD: eventos123
      REDIS_HOST: redis
      REDIS_PORT: 6379
    ports:
      - "8004:8000"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - eventos_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/up"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Certificados Service (Django/Python)
  certificados-service:
    build: ./backend/certificados-service
    container_name: eventos_certificados
    restart: unless-stopped
    environment:
      DEBUG: False
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: eventos
      DB_USERNAME: eventos
      DB_PASSWORD: eventos123
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: "eventos-certificados-secret-key-change-in-production"
      ALLOWED_HOSTS: "localhost,127.0.0.1,177.44.248.89,certificados-service"
    ports:
      - "8005:8000"
    volumes:
      - certificados_media:/app/media
      - certificados_static:/app/static
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - eventos_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Celery Worker para processamento assíncrono
  celery-worker:
    build: ./backend/certificados-service
    container_name: eventos_celery
    restart: unless-stopped
    command: celery -A certificados_service worker --loglevel=info --concurrency=2
    environment:
      DEBUG: False
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: eventos
      DB_USERNAME: eventos
      DB_PASSWORD: eventos123
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: "eventos-certificados-secret-key-change-in-production"
    volumes:
      - certificados_media:/app/media
      - certificados_static:/app/static
    depends_on:
      - mysql
      - redis
      - certificados-service
    networks:
      - eventos_network

  # Frontend React
  frontend:
    build: ./frontend
    container_name: eventos_frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - auth-service
      - eventos-service
      - inscricoes-service
      - presenca-service
      - certificados-service
    networks:
      - eventos_network

# Configuração removida: Gateway com Nginx (simplificado para acesso direto às portas dos serviços)

networks:
  eventos_network:
    driver: bridge

volumes:
  mysql_data:
  redis_data:
  certificados_media:
  certificados_static:
